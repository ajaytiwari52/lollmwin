[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ollama-coder"
version = "0.1.0"
description = "A local terminal coding assistant powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
ollama-coder = "ollama_coder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
